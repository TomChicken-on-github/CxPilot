name: Build Executable Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建和更新 Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Executable
        run: pnpm run build:exe

      - name: Update Development Release (Push to main)
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: dev-latest
          name: 🚧 Development Build (Latest)
          prerelease: true
          files: dist/CxPilot.exe
          body: |
            自动构建的最新开发版。
            **Commit:** ${{ github.sha }}
            
            ⚠️ *注意：此版本包含最新功能，但可能不稳定。*

      - name: Publish Stable Release (Push tag v*)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/CxPilot.exe
          generate_release_notes: true
