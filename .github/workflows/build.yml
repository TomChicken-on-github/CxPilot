name: Build Executable Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build Executable
        run: npm run build:exe -- --debug

      - name: Install signing tools
        run: sudo apt-get install -y osslsigncode

      - name: Sign Executable
        run: |
          openssl req -new -newkey rsa:4096 -x509 -nodes \
            -keyout /tmp/signing.key \
            -out /tmp/signing.crt \
            -subj "/CN=Tom_Chicken/O=Tom_Chicken/C=CN" \
            -days 3650
          osslsigncode sign \
            -certs /tmp/signing.crt \
            -key /tmp/signing.key \
            -n "CxPilot" \
            -i "https://github.com/TomChicken-on-github/CxPilot" \
            -in dist/CxPilot.exe \
            -out dist/CxPilot-signed.exe
          mv dist/CxPilot-signed.exe dist/CxPilot.exe

      - name: List dist output
        run: ls -lh dist/ || echo "dist/ is empty or missing"

      - name: Update Development Release (Push to main)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: dev-latest
          name: 🚧 Development Build (Latest)
          prerelease: true
          files: dist/CxPilot.exe
          body: |
            自动构建的最新开发版。
            **Commit:** ${{ github.sha }}

            ⚠️ *注意：此版本包含最新功能，但可能不稳定。*

      - name: Publish Stable Release (Push tag v*)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/CxPilot.exe
          generate_release_notes: true
